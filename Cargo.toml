[package]
name = "mygui"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3.3"
bitflags = "2.6.0"
bytemuck = { version = "1.19.0", features = ["derive"] }
dyn-clone = "1.0.17"
dyn-hash = "0.2.0"
dyn_partial_eq = "0.1.2"
dyn_partial_eq_derive = "0.1.2"
env_logger = "0.11.6"
freetype-rs = { version = "0.37.0", features = ["bundled"] }
futures = "0.3.31"
glam = { version = "0.29.2", features = ["bytemuck"] }
log = "0.4.22"
serde = { version = "1.0.216", features = ["derive"] }
walkdir = "2.5.0"
wgpu = { version = "23.0.0", features = ["spirv"] }
winit = "0.30.5"
zstd = "0.13.2"

[dev-dependencies]
pretty_assertions = "1.4.1"

[patch.crates-io]
freetype-sys = { git = "https://github.com/tpeyronel/freetype-sys", branch = "optsubpixel" }
